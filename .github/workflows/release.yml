name: Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-published version to (re)run the Windows build and Chocolatey publish for, e.g. 0.8.0. Use this to recover build-windows/publish-chocolatey after a partial release run (they are otherwise gated on the changesets found in the original PR-merge run, which are consumed and unavailable on rerun).'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.merged == true
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # Dry mirror of scripts/bump-version.sh's version computation; keep the
      # two in sync.
      - name: Determine release mode and version
        id: mode
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(grep -m1 'version = ' Cargo.toml | cut -d'"' -f2)
          CHANGESETS=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null || true)
          if [ -n "$CHANGESETS" ]; then
            BUMP_TYPE="patch"
            for changeset in $CHANGESETS; do
              bump=$(sed -n '/^---$/,/^---$/{ /^bump:/{ s/^bump: *//; p; } }' "$changeset" | tr -d '\r\n')
              if [ "$bump" = "major" ]; then
                BUMP_TYPE="major"
              elif [ "$bump" = "minor" ] && [ "$BUMP_TYPE" != "major" ]; then
                BUMP_TYPE="minor"
              fi
            done
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "$BUMP_TYPE" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            MODE="release"
            echo "Found changesets; next version: $VERSION (bump: $BUMP_TYPE)"
          elif ! git ls-remote --exit-code --tags origin "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            VERSION="$CURRENT_VERSION"
            MODE="resume"
            echo "No changesets but v${CURRENT_VERSION} has no tag; resuming that release"
          else
            VERSION=""
            MODE="noop"
            echo "No changesets and v${CURRENT_VERSION} is already tagged; nothing to release"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup SSH deploy key
        if: steps.mode.outputs.mode != 'noop'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Probe DEPLOY_KEY
        if: steps.mode.outputs.mode != 'noop'
        run: |
          set -euo pipefail
          GREETING=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no git@github.com 2>&1 || true)
          echo "$GREETING"
          echo "$GREETING" | grep -q "successfully authenticated"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            git ls-remote git@github.com:kanban-rs/kanban.git HEAD > /dev/null
          echo "DEPLOY_KEY authenticates and can read kanban-rs/kanban"

      - name: Probe CARGO_REGISTRY_TOKEN
        if: steps.mode.outputs.mode != 'noop'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: $CARGO_REGISTRY_TOKEN" https://crates.io/api/v1/me > /dev/null
          echo "CARGO_REGISTRY_TOKEN is accepted by crates.io"

      - name: Probe AUR_SSH_KEY
        if: steps.mode.outputs.mode != 'noop'
        run: |
          set -euo pipefail
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          GREETING=$(ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no aur@aur.archlinux.org 2>&1 || true)
          echo "$GREETING"
          echo "$GREETING" | grep -q "Welcome to AUR"
          echo "AUR_SSH_KEY is accepted by aur.archlinux.org"

      - name: Probe HOMEBREW_TAP_DEPLOY_KEY
        if: steps.mode.outputs.mode != 'noop'
        run: |
          set -euo pipefail
          echo "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}" > ~/.ssh/homebrew_tap_key
          chmod 600 ~/.ssh/homebrew_tap_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/homebrew_tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            git ls-remote git@github.com:fulsomenko/homebrew-tap.git HEAD > /dev/null
          echo "HOMEBREW_TAP_DEPLOY_KEY can read fulsomenko/homebrew-tap"

      - name: Probe WINGET_TOKEN
        if: steps.mode.outputs.mode != 'noop'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: token $WINGET_TOKEN" https://api.github.com/user > /dev/null
          echo "WINGET_TOKEN is accepted by the GitHub API"

      - name: Probe CHOCO_API_KEY
        if: steps.mode.outputs.mode != 'noop'
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$CHOCO_API_KEY" ]
          echo "CHOCO_API_KEY is set"

  prepare:
    name: Prepare release commit
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: needs.preflight.outputs.mode == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:kanban-rs/kanban.git

      # bump-version reads changesets, aggregate-changelog reads then deletes them.
      # These two steps must run in this order.
      - name: Bump version from changesets
        run: |
          nix develop --command bump-version

      - name: Aggregate changelog
        run: |
          nix develop --command aggregate-changelog "${{ github.event.pull_request.number }}"

      - name: Commit release changes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          NEW_VERSION=$(grep -m1 'version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$NEW_VERSION" != "$VERSION" ]; then
            echo "::error::bump-version produced ${NEW_VERSION} but preflight computed ${VERSION}"
            exit 1
          fi
          echo "Release version: $NEW_VERSION"
          git add .
          git commit -m "chore: release v${NEW_VERSION}"

      - name: Validate release build
        run: |
          nix develop --command validate-release

      - name: Push release commit
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin master
          REMOTE_VERSION=$(git show origin/master:Cargo.toml | grep -m1 'version = ' | cut -d'"' -f2)
          if [ "$REMOTE_VERSION" = "$VERSION" ]; then
            echo "origin/master already carries the v${VERSION} release commit, skipping push"
          else
            git push origin master
          fi

  publish-crates:
    name: Publish to crates.io
    needs: [preflight, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `prepare` is legitimately skipped in resume mode; without !cancelled()
    # here, GitHub Actions auto-skips this job whenever ANY needs job is
    # skipped, regardless of this condition (a known runner quirk). The
    # explicit result checks restore the gating that !cancelled() bypasses.
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.mode != 'noop' &&
      (needs.prepare.result == 'success' ||
       (needs.prepare.result == 'skipped' && needs.preflight.outputs.mode == 'resume'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          CHECKED_OUT=$(grep -m1 'version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$CHECKED_OUT" != "$VERSION" ]; then
            echo "::error::master is at ${CHECKED_OUT} but this run releases ${VERSION}; refusing to publish"
            exit 1
          fi
          echo "Publishing to crates.io..."
          nix run .#publish-crates
          echo "Published successfully"

  tag-release:
    name: Tag and create GitHub Release
    needs: [preflight, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:kanban-rs/kanban.git

      - name: Tag version
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          TAG: v${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          HEAD_VERSION=$(grep -m1 'version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v${HEAD_VERSION}" != "$TAG" ]; then
            echo "::error::master is at v${HEAD_VERSION} but this run releases ${TAG}; refusing to tag"
            exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, skipping git tag"
          else
            git tag "$TAG"
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, skipping git push"
          else
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          generate_release_notes: true

  publish-aur:
    name: Publish to AUR
    needs: [preflight, tag-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:kanban-rs/kanban.git

      - name: Update PKGBUILD version and sha256
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/kanban-rs/kanban/archive/v${VERSION}.tar.gz"
          SHA256=$(curl -fsL "$URL" | sha256sum | cut -d' ' -f1)
          sed -i "s|^pkgver=.*|pkgver=${VERSION}|" ./packaging/aur/PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" ./packaging/aur/PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=(\"${SHA256}\")|" ./packaging/aur/PKGBUILD

      - name: Generate .SRCINFO
        run: |
          # Single quotes are required: the expansions run in the inner pacman
          # shell where makepkg is on PATH, not the runner shell.
          # shellcheck disable=SC2016
          nix shell nixpkgs#pacman -c sh -c '
            PACMAN_ROOT="$(dirname "$(dirname "$(command -v makepkg)")")"
            export MAKEPKG_CONF="$PACMAN_ROOT/etc/makepkg.conf"
            cd packaging/aur && makepkg --printsrcinfo > .SRCINFO
          '

      - name: Commit and push AUR files
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
        run: |
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update AUR package to v${{ needs.preflight.outputs.version }}"
            git push origin master
          fi

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7
        with:
          pkgname: kanban
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Update to v${{ needs.preflight.outputs.version }}"
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          updpkgsums: false
          allow_empty_commits: false

  publish-homebrew:
    name: Publish to Homebrew tap
    needs: [preflight, tag-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compute upstream tarball SHA256 for Homebrew
        id: brew-sha
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/kanban-rs/kanban/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -fsL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Setup Homebrew tap SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}" > ~/.ssh/homebrew_tap_key
          chmod 600 ~/.ssh/homebrew_tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Bump formula in homebrew-tap
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/homebrew_tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA: ${{ steps.brew-sha.outputs.sha256 }}
          URL: ${{ steps.brew-sha.outputs.url }}
        run: |
          set -euo pipefail
          git clone git@github.com:fulsomenko/homebrew-tap.git /tmp/homebrew-tap
          sed -i "s|^  url \".*\"|  url \"${URL}\"|" /tmp/homebrew-tap/Formula/kanban.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" /tmp/homebrew-tap/Formula/kanban.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kanban.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "kanban ${VERSION}"
            git push origin master
          fi

  sync-develop:
    name: Sync develop with master
    needs: [tag-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:kanban-rs/kanban.git

      - name: Sync develop with master
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
        run: |
          git checkout develop
          git pull origin develop
          if ! git merge origin/master --no-edit; then
            echo "::error::Failed to auto-merge master into develop. Manual merge required."
            git merge --abort
            exit 1
          fi
          git push origin develop

  resolve-version:
    name: Resolve release version
    needs: [preflight]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.preflight.result }}" = "success" ] && [ "${{ needs.preflight.outputs.mode }}" != "noop" ]; then
            echo "version=${{ needs.preflight.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows release archive
    needs: [resolve-version, tag-release]
    # `tag-release` is legitimately skipped on a workflow_dispatch trigger;
    # without !cancelled() here, GitHub Actions auto-skips this job whenever
    # ANY needs job is skipped, regardless of this condition (a known runner
    # quirk). The explicit result checks restore the gating that !cancelled()
    # bypasses: on the normal path the tag must exist before building.
    if: >-
      !cancelled() &&
      needs.resolve-version.outputs.should_run == 'true' &&
      (needs.tag-release.result == 'success' ||
       (needs.tag-release.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.resolve-version.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build kanban + kanban-mcp (release)
        shell: pwsh
        run: |
          cargo build --release `
            --package kanban-cli `
            --package kanban-mcp `
            --target x86_64-pc-windows-msvc

      - name: Stage archive contents
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $stage = "stage/kanban-v$env:VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/kanban.exe     $stage/
          Copy-Item target/x86_64-pc-windows-msvc/release/kanban-mcp.exe $stage/
          Copy-Item LICENSE.md $stage/
          Copy-Item README.md  $stage/
          & "$stage/kanban.exe" --version
          & "$stage/kanban-mcp.exe" --version

      - name: Compress archive
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $name = "kanban-v$env:VERSION-x86_64-pc-windows-msvc"
          Compress-Archive -Path "stage/$name/*" -DestinationPath "$name.zip" -Force

      - name: Write SHA256SUMS
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $name = "kanban-v$env:VERSION-x86_64-pc-windows-msvc.zip"
          $sha  = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower()
          "$sha  $name" | Out-File -Encoding ascii -FilePath SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          files: |
            kanban-v${{ needs.resolve-version.outputs.version }}-x86_64-pc-windows-msvc.zip
            SHA256SUMS
          fail_on_unmatched_files: true

  publish-chocolatey:
    name: Publish to Chocolatey
    needs: [resolve-version, build-windows]
    # See build-windows: needs-skip-propagation requires always() even though
    # `tag-release` being skipped is expected on a workflow_dispatch trigger.
    # Guard build-windows explicitly since always() also bypasses the default
    # success() check against it.
    if: always() && needs.resolve-version.outputs.should_run == 'true' && needs.build-windows.result == 'success'
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.resolve-version.outputs.version }}

      - name: Read Windows ZIP digest from GitHub Release
        id: sha
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          $asset = "kanban-v$env:VERSION-x86_64-pc-windows-msvc.zip"
          $ok = $false
          for ($i = 1; $i -le 30; $i++) {
            $json = gh release view "v$env:VERSION" --repo $env:REPO `
              --json assets --jq ".assets[] | select(.name == `"$asset`")" 2>$null
            if ($json) {
              $obj = $json | ConvertFrom-Json
              if ($obj.state -eq 'uploaded' -and $obj.digest) {
                $sha = $obj.digest -replace '^sha256:', ''
                Write-Output "Found ${asset}: sha=$sha"
                "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                $ok = $true
                break
              }
              Write-Output ("Attempt {0}: state='{1}' digest='{2}'" -f $i, $obj.state, $obj.digest)
            } else {
              Write-Output ("Attempt {0}: asset not yet listed" -f $i)
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            Write-Error "Release asset never became ready after 30 attempts (~150s)"
            exit 1
          }

      - name: Stage Chocolatey package with substitutions
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          $build = "build/chocolatey"
          New-Item -ItemType Directory -Path "$build/tools" -Force | Out-Null
          Copy-Item packaging/chocolatey/kanban.nuspec $build/kanban.nuspec
          Copy-Item packaging/chocolatey/tools/* $build/tools/ -Recurse

          (Get-Content "$build/kanban.nuspec") `
            -replace '\$version\$', $env:VERSION `
            | Set-Content "$build/kanban.nuspec"

          (Get-Content "$build/tools/chocolateyinstall.ps1") `
            -replace '\$version\$',   $env:VERSION `
            -replace '\$checksum64\$', $env:SHA `
            | Set-Content "$build/tools/chocolateyinstall.ps1"

      - name: choco pack
        shell: pwsh
        working-directory: build/chocolatey
        run: choco pack

      - name: Smoke install from local nupkg
        shell: pwsh
        working-directory: build/chocolatey
        run: |
          choco install kanban -s . -y --force --no-progress
          kanban --version
          kanban-mcp --version

      - name: choco push
        shell: pwsh
        working-directory: build/chocolatey
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Pre-check: if this version is already published and approved,
          # treat as success. This makes the job safe to re-run after a
          # transient workflow failure that followed a successful push.
          # NB: Submitted/Waiting-for-Reviewer states are NOT visible via
          # the public v2 OData API, so a 404 here does not prove the
          # package is unpublished — see packaging/chocolatey/RECOVERY.md.
          $checkUrl = "https://community.chocolatey.org/api/v2/Packages(Id='kanban',Version='$env:VERSION')"
          try {
            $null = Invoke-RestMethod -Uri $checkUrl -TimeoutSec 30 -ErrorAction Stop
            Write-Output "kanban $env:VERSION is already published on Chocolatey; nothing to do."
            exit 0
          } catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($status -ne 404) {
              Write-Output ("Pre-check returned status {0} ({1}); proceeding to push anyway." -f $status, $_.Exception.Message)
            }
          }

          try {
            choco push "kanban.$env:VERSION.nupkg" `
              --api-key="$env:CHOCO_API_KEY" `
              --source="https://push.chocolatey.org/"
            if ($LASTEXITCODE -ne 0) { throw "choco push exited $LASTEXITCODE" }
          } catch {
            Write-Output ""
            Write-Output "=== Chocolatey publish failed ==="
            Write-Output "Recovery runbook: packaging/chocolatey/RECOVERY.md"
            Write-Output "Chocolatey rejects re-push of the same id+version permanently."
            Write-Output "Do NOT simply re-run this job before diagnosing — see the runbook."
            Write-Output "================================="
            throw
          }

      - name: Note moderation expectations
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          Write-Output "==="
          Write-Output "Pushed kanban v$env:VERSION to community.chocolatey.org."
          Write-Output "First-time moderation typically takes 1-7 days."
          Write-Output "Status:"
          Write-Output "  https://community.chocolatey.org/packages/kanban/$env:VERSION"
          Write-Output "==="

      - name: Surface chocolatey failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNBOOK_URL: ${{ github.server_url }}/${{ github.repository }}/blob/v${{ needs.resolve-version.outputs.version }}/packaging/chocolatey/RECOVERY.md
        run: |
          Write-Output "::warning title=Chocolatey publish failed::v$env:VERSION did not publish to Chocolatey. See packaging/chocolatey/RECOVERY.md for recovery steps."
          $lines = @(
            "## Chocolatey publish failed for v$env:VERSION",
            "",
            "The ``publish-chocolatey`` job exited non-zero. The rest of the",
            "release (crates.io, GitHub Release, AUR, Homebrew) is unaffected",
            "because this job is ``continue-on-error: true``.",
            "",
            "**Workflow run:** $env:RUN_URL",
            "",
            "**Next step:** follow [``packaging/chocolatey/RECOVERY.md``]($env:RUNBOOK_URL)."
          )
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

  publish-winget:
    name: Submit to winget
    needs: [resolve-version, build-windows]
    # See build-windows: needs-skip-propagation requires always() even though
    # `tag-release` being skipped is expected on a workflow_dispatch trigger.
    # Guard build-windows explicitly since always() also bypasses the default
    # success() check against it.
    if: always() && needs.resolve-version.outputs.should_run == 'true' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Wait for Windows ZIP asset to be ready
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          asset="kanban-v${VERSION}-x86_64-pc-windows-msvc.zip"
          for i in $(seq 1 30); do
            state=$(gh release view "v${VERSION}" --repo "$REPO" \
              --json assets --jq ".assets[] | select(.name == \"$asset\") | .state" 2>/dev/null || true)
            if [ "$state" = "uploaded" ]; then
              echo "Found ${asset}: state=uploaded"
              exit 0
            fi
            echo "Attempt ${i}: state='${state:-not-listed}'"
            sleep 5
          done
          echo "Release asset ${asset} never became ready after 30 attempts (~150s)" >&2
          exit 1

      - name: Submit manifest to winget-pkgs
        # winget-releaser only UPDATES a package already present in
        # winget-pkgs; the first-ever version of a new identifier must be
        # submitted manually. See packaging/winget/README.md.
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: fulsomenko.kanban
          version: ${{ needs.resolve-version.outputs.version }}
          release-tag: v${{ needs.resolve-version.outputs.version }}
          # Default regex only matches exe/msi/msix/appx; the release ships
          # a zip, so this override is mandatory. Must not match SHA256SUMS.
          installers-regex: 'kanban-v.*-x86_64-pc-windows-msvc\.zip$'
          max-versions-to-keep: 5
          fork-user: fulsomenko
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Surface winget failure
        if: failure()
        continue-on-error: true
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning title=winget submission failed::v${VERSION} was not submitted to winget-pkgs. See packaging/winget/README.md."
          {
            echo "## winget submission failed for v${VERSION}"
            echo ""
            echo "The \`publish-winget\` job exited non-zero. The rest of the"
            echo "release (crates.io, GitHub Release, AUR, Homebrew, Chocolatey)"
            echo "is unaffected because this job is \`continue-on-error: true\`."
            echo ""
            echo "**Most common cause:** the first-ever submission of a new package"
            echo "identifier must be made manually; \`winget-releaser\` only updates"
            echo "packages already present in winget-pkgs. See \`packaging/winget/README.md\`."
            echo ""
            echo "**Workflow run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
